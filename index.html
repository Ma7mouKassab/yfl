<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#041a2b">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>MYL</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one-column phone app. Summary card on top, month chips, grouped list; floating pill nav with a raised mint add button. Palette follows the logo: deep teal and navy, mint green, coin gold. */
:root{
  --bg:#041a2b;--surface:#0a2b42;--surface2:#10405c;--line:rgba(150,225,235,.11);
  --fg:#eef9f9;--muted:#8fb5c2;--accent:#2fdc9c;--accent-ink:#022a2b;--accent-text:#4ae6b0;
  --good:#58e08b;--bad:#ff7d6e;--gold:#ffc83d;--glow:rgba(47,220,156,.20);--nav:rgba(8,38,58,.88);
  --btn-a:#86f3cb;--btn-c:#12aaa3;--hero-a:#0f5570;--hero-b:#082f48;
  --shadow:0 14px 40px rgba(0,8,20,.55);
  --c1:#ff8a5b;--c2:#ffd23f;--c3:#5cc8ff;--c4:#b388ff;--c5:#4ad8a0;--c6:#ff6b9a;
  --c7:#7c9cff;--c8:#ff5d5d;--c9:#46c2c2;--c10:#c0d94a;--c11:#ff9f1c;--c12:#8d99ae;
  --font-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic","Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e9f4f6;--surface:#ffffff;--surface2:#d9ebee;--line:rgba(4,48,79,.10);
    --fg:#06293f;--muted:#4f6f7e;--accent:#1ccb98;--accent-ink:#03312c;--accent-text:#0a8470;
    --good:#0f9560;--bad:#d6402f;--gold:#a56b00;--glow:rgba(28,203,152,.28);--nav:rgba(255,255,255,.9);
    --btn-a:#7cf0c6;--btn-c:#12aaa3;--hero-a:#cdeeea;--hero-b:#ffffff;
    --shadow:0 14px 36px rgba(4,48,79,.14);color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e9f4f6;--surface:#ffffff;--surface2:#d9ebee;--line:rgba(4,48,79,.10);
  --fg:#06293f;--muted:#4f6f7e;--accent:#1ccb98;--accent-ink:#03312c;--accent-text:#0a8470;
  --good:#0f9560;--bad:#d6402f;--gold:#a56b00;--glow:rgba(28,203,152,.28);--nav:rgba(255,255,255,.9);
  --btn-a:#7cf0c6;--btn-c:#12aaa3;--hero-a:#cdeeea;--hero-b:#ffffff;
  --shadow:0 14px 36px rgba(4,48,79,.14);color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#041a2b;--surface:#0a2b42;--surface2:#10405c;--line:rgba(150,225,235,.11);
  --fg:#eef9f9;--muted:#8fb5c2;--accent:#2fdc9c;--accent-ink:#022a2b;--accent-text:#4ae6b0;
  --good:#58e08b;--bad:#ff7d6e;--gold:#ffc83d;--glow:rgba(47,220,156,.20);--nav:rgba(8,38,58,.88);
  --btn-a:#86f3cb;--btn-c:#12aaa3;--hero-a:#0f5570;--hero-b:#082f48;
  --shadow:0 14px 40px rgba(0,8,20,.55);color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;font-variant-numeric:tabular-nums;
  background-image:radial-gradient(90% 36% at 50% -4%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 72%);background-repeat:no-repeat;
}
body.lock{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:10px}
h1,h2,h3,p{margin:0}
.shell{max-width:480px;margin:0 auto;min-height:100vh}
.screen{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.screen.in{animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:14px}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.04em}
h1{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.25;text-wrap:balance}
.acts{display:flex;gap:8px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.iconbtn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.ic{width:22px;height:22px;flex:none}

.demo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:16px;background:var(--surface);border:1px dashed var(--line);font-size:13px;color:var(--muted)}
.link{color:var(--accent-text);font-weight:600;font-size:13px;padding:6px 4px}
.link.bad{color:var(--bad)}

.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px;background:linear-gradient(155deg,var(--hero-a),var(--hero-b));border:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:-40% auto auto -20%;width:70%;aspect-ratio:1;background:radial-gradient(circle,var(--glow),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.lbl{font-size:13px;color:var(--muted)}
.big{font-family:var(--font-display);font-size:40px;font-weight:600;line-height:1.2;letter-spacing:-.01em;margin-top:2px}
.big i,.cur{font-style:normal;font-size:.42em;font-weight:500;color:var(--muted);margin-inline-start:6px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stat{padding:10px 12px;border-radius:16px;background:color-mix(in srgb,var(--bg) 55%,transparent);min-width:0}
.stat .k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.stat .k .ic{width:15px;height:15px}
.stat .v{font-family:var(--font-display);font-weight:600;font-size:15px;margin-top:2px;overflow-wrap:anywhere}
.k.g .ic{color:var(--good)}.k.b .ic{color:var(--bad)}.k.a .ic{color:var(--gold)}
.budget{margin-top:16px}
.budget .row2{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px;gap:8px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.hero .bar{background:color-mix(in srgb,var(--bg) 60%,transparent)}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.warn i{background:var(--c11)}.bar.over i{background:var(--bad)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;color:var(--muted);font-weight:500}
.chip.on{background:var(--fg);color:var(--bg);border-color:transparent}

.search{width:100%;height:46px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:0 16px;outline:none}
.search:focus{border-color:var(--accent-text)}
.search::placeholder,.field input::placeholder{color:var(--muted)}

.day{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin:6px 4px 8px}
.day b{font-weight:600}
ul.list{list-style:none;margin:0;padding:0;border-radius:24px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.row+.row{border-top:1px solid var(--line)}
.row-main{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:start}
.ico{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;flex:none;color:var(--tint);background:color-mix(in srgb,var(--tint) 16%,transparent)}
.meta{display:flex;flex-direction:column;min-width:0;flex:1}
.meta b{font-weight:600;font-size:15px}
.meta small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-family:var(--font-display);font-weight:600;font-size:15px;white-space:nowrap}
.amt i{font-style:normal;font-size:11px;color:var(--muted);font-weight:500;margin-inline-start:3px}
.amt.inc{color:var(--good)}.amt.sav{color:var(--gold)}
.row-ext{display:flex;justify-content:space-between;align-items:center;padding:0 14px 10px 14px;font-size:12.5px;color:var(--muted)}

.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:56px 24px;text-align:center;color:var(--muted)}
.empty .ic{width:56px;height:56px;stroke-width:1.3;opacity:.7}
.empty b{color:var(--fg);font-size:16px;font-weight:600}

.seg{display:flex;padding:4px;border-radius:16px;background:var(--surface);border:1px solid var(--line);gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

.card{border-radius:24px;background:var(--surface);border:1px solid var(--line);padding:18px}
.card h2{font-family:var(--font-display);font-size:16px;font-weight:600;margin-bottom:12px}
.donut{position:relative;width:min(220px,70vw);aspect-ratio:1;margin:4px auto 16px}
.donut svg{width:100%;height:100%;display:block}
.dt{fill:none;stroke:var(--surface2);stroke-width:4.5}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut-c small{font-size:12px;color:var(--muted)}
.donut-c b{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1.2}
.donut-c i{font-style:normal;font-size:12px;color:var(--muted)}
.leg{display:flex;flex-direction:column;gap:14px}
.lg{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.lg .ico{width:38px;height:38px;border-radius:13px;grid-row:span 2}
.lg .nm{font-weight:600;font-size:14.5px}
.lg .nm span{color:var(--muted);font-weight:500;font-size:12.5px;margin-inline-start:6px}
.lg .vl{font-family:var(--font-display);font-weight:600;font-size:14px;text-align:end}
.lg .bar{grid-column:2/4;height:6px}
.lg .bar i{background:var(--tint)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);min-width:0}
.fact small{display:block;color:var(--muted);font-size:12.5px}
.fact b{display:block;font-family:var(--font-display);font-size:17px;font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.chart{width:100%;height:auto;display:block;overflow:visible}
.ax{fill:var(--muted);font:500 10.5px var(--font-body)}
.ax.on{fill:var(--fg);font-weight:700}
.gl{stroke:var(--line);stroke-width:1}
.b-inc{fill:var(--good)}.b-exp{fill:var(--gold)}
.key{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:10px}
.key span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;background:var(--gold)}
.key span.i::before{background:var(--good)}

.goal{border-radius:24px;background:var(--surface);border:1px solid var(--line);padding:16px;display:grid;grid-template-columns:64px 1fr;gap:4px 14px;align-items:center}
.ring{position:relative;width:64px;height:64px}
.ringsvg{width:100%;height:100%;display:block}
.rt{fill:none;stroke:var(--surface2);stroke-width:6}
.rf{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:13px;font-weight:600}
.goal h3{font-family:var(--font-display);font-size:16px;font-weight:600}
.goal p{font-size:13px;color:var(--muted);margin:2px 0 8px}
.goal .acts2{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
.done{display:inline-block;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);font-size:12px;font-weight:600;margin-inline-start:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:15px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14.5px}
.btn.sm{height:36px;padding:0 16px;font-size:13.5px;border-radius:12px}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn.block{position:relative;width:100%;height:58px;border-radius:20px;font-size:17px;font-weight:700;gap:10px;background:linear-gradient(135deg,var(--btn-a) 0%,var(--accent) 50%,var(--btn-c) 100%);color:var(--accent-ink);box-shadow:0 14px 30px var(--glow),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.09);transition:transform .12s ease,box-shadow .2s ease}
.btn.block .ic{width:22px;height:22px;stroke-width:2.4;flex:none}
.btn.block:not([disabled]):active{transform:translateY(1px) scale(.985);box-shadow:0 6px 16px var(--glow),inset 0 2px 0 rgba(255,255,255,.4)}
.btn.block[disabled]{background:var(--surface2);color:var(--muted);box-shadow:none;opacity:1}
.savebar{position:sticky;bottom:0;z-index:2;margin:0 calc(-1*max(16px,env(safe-area-inset-right,0px))) 0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:20px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 68%,transparent)}
.exg{display:flex;flex-direction:column;gap:10px}
.exl{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.mchips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 2px;border-radius:16px;background:var(--surface);border:2px solid transparent;line-height:1.25;min-width:0}
.mc b{font-weight:600;font-size:13.5px}
.mc small{font-size:11px;color:var(--muted)}
.mc.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exsum{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.exsum span{min-width:0;overflow-wrap:anywhere}
.exsum b{color:var(--fg);white-space:nowrap}
.exsum.zero b{color:var(--bad)}
.fmts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fmtc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;border-radius:20px;background:var(--surface);border:2px solid transparent;min-width:0}
.fmtc .ic{width:26px;height:26px;color:var(--muted)}
.fmtc b{font-weight:700;font-size:14.5px}
.fmtc small{font-size:11.5px;color:var(--muted)}
.fmtc.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.fmtc.on .ic{color:var(--accent-text)}
.sect{display:flex;flex-direction:column;gap:12px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.setrow>span{font-weight:600}
.setrow small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.field input{width:100%;height:50px;border-radius:16px;border:1px solid var(--line);background:var(--surface2);padding:0 16px;outline:none}
.field input:focus{border-color:var(--accent-text)}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.mini button{padding:7px 14px;border-radius:12px;background:var(--surface2);font-weight:600;font-size:13.5px;color:var(--muted)}
.mini button.on{background:var(--accent);color:var(--accent-ink)}
.note{font-size:12.5px;color:var(--muted)}

.amount{border-radius:24px;background:var(--surface);border:1.5px solid var(--line);padding:14px 16px 12px;cursor:text;transition:border-color .15s,box-shadow .15s}
.amount:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.amt-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;padding:3px 12px;border-radius:99px;font-weight:600;font-size:12.5px;color:var(--tt);background:color-mix(in srgb,var(--tt) 15%,transparent)}
.amt-row{display:flex;align-items:center;gap:12px;margin:8px 0 12px}
.amt-row input{flex:1;min-width:0;width:100%;background:none;border:0;outline:none;padding:0;text-align:center;direction:ltr;font-family:var(--font-display);font-size:48px;font-weight:600;line-height:1.2;color:var(--fg)}
.amt-row input::placeholder{color:var(--muted);opacity:.4}
.curpill{flex:none;padding:7px 14px;border-radius:12px;background:var(--surface2);font-weight:700;font-size:14px}
.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.quick button{padding:7px 14px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--muted)}
.quick button:active{background:var(--accent);color:var(--accent-ink)}
.custom{border-radius:20px;background:var(--surface);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:14px}
.iconpick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ip{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;color:var(--tint);background:color-mix(in srgb,var(--tint) 12%,transparent);border:2px solid transparent}
.ip .ic{width:22px;height:22px}
.ip.sel{border-color:var(--tint);background:color-mix(in srgb,var(--tint) 30%,transparent)}

.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:48px;height:48px;border-radius:15px;flex:none;box-shadow:0 6px 18px rgba(0,8,20,.35)}
.brandcard{display:flex;align-items:center;gap:16px;padding:18px;border-radius:28px;background:linear-gradient(155deg,var(--hero-a),var(--hero-b));border:1px solid var(--line)}
.brandcard .logo{width:76px;height:76px;border-radius:22px}
.brandcard b{display:block;font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1.2;letter-spacing:.02em}
.brandcard span{display:block;color:var(--muted);font-size:14px}
.brandcard small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.navbar{pointer-events:auto;max-width:480px;margin:0 auto;height:68px;border-radius:30px;background:var(--nav);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);font-weight:500;height:100%;justify-content:center}
.nb.on{color:var(--accent-text)}
.fab{justify-self:center;width:60px;height:60px;border-radius:50%;background:linear-gradient(145deg,var(--btn-a),var(--accent) 55%,var(--btn-c));color:var(--accent-ink);display:grid;place-items:center;transform:translateY(-16px);box-shadow:0 10px 28px var(--glow),0 0 0 6px var(--bg)}
.fab .ic{width:28px;height:28px;stroke-width:2.2}
.fab:active{transform:translateY(-14px) scale(.96)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}

function load(key){

var U={backup:'',restore:false,restoreErr:'',view:'tx',month:mkey(new Date()),q:'',search:false,stat:'exp',sheet:null,open:null,confirm:null};

function lastMonths(n){var out=[],d=new Date();d.setDate(1);for(var i=0;i<n;i++){out.push(mkey(d));d.setMonth(d.getMonth()-1)}return out}
function sums(key){var inc=0,exp=0,sav=0;S.tx.forEach(function(t){if(t.date.slice(0,7)!==key)return;if(t.type==='inc')inc+=t.amount;else if(t.type==='exp')exp+=t.amount;else sav+=t.amount});return {inc:inc,exp:exp,sav:sav}}
function catById(type,id){var a=type==='inc'?INC:EXP;return a.find(function(c){return c.id===id})||a[a.length-1]}
function catKey(t){return t.cat==='other'&&t.cn?'x:'+(t.ci||'dots')+'|'+t.cn:t.cat}
function catByKey(type,key){
  if(key.slice(0,2)==='x:'){var r=key.slice(2),i=r.indexOf('|'),ci=r.slice(0,i),cn=r.slice(i+1);return {id:key,n:esc(cn),i:P[ci]?ci:'dots',c:ICOL[ci]||'--c12'}}
  return catById(type,key);
}
function customCats(type){var seen={},out=[];S.tx.forEach(function(t){if(t.type!==type||t.cat!=='other'||!t.cn)return;var k=catKey(t);if(!seen[k]){seen[k]=1;out.push(catByKey(type,k))}});return out}
function catOf(t){return t.type==='sav'?SAVC:catByKey(t.type,catKey(t))}
function goalName(t){var g=S.goals.find(function(x){return x.id===t.goal});return g?g.name:''}
function savedOf(id){return S.tx.reduce(function(a,t){return t.type==='sav'&&t.goal===id?a+t.amount:a},0)}
function dayLabel(ds){
  var d=parse(ds),t=new Date();t.setHours(0,0,0,0);
  var diff=Math.round((t-d)/86400000);
  if(diff===0)return 'اليوم';if(diff===1)return 'أمس';
  return new Intl.DateTimeFormat(MYL_L.loc,{weekday:'long',day:'numeric',month:'long'}).format(d);
}
var fullDate=function(ds){return new Intl.DateTimeFormat(MYL_L.loc,{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(parse(ds))};

function head(title,actions){return '<header class="top"><div class="brand"><img class="logo" src="'+LOGO+'" alt="MYL"><div><p class="eyebrow">'+(S.name?'أهلاً، '+esc(S.name):'MYL')+'</p><h1>'+title+'</h1></div></div><div class="acts">'+(actions||'')+'<button class="iconbtn" data-act="account-open" aria-label="الحساب">'+ic('user')+'</button></div></header>'}
function chips(){
  return '<div class="chips" role="tablist" aria-label="الشهر">'+lastMonths(MONTHS_BACK).map(function(k,i){
    var l=i===0?'هذا الشهر':i===1?'الشهر الماضي':monthName(k,true);
    return '<button class="chip'+(U.month===k?' on':'')+'" role="tab" aria-selected="'+(U.month===k)+'" data-act="month" data-v="'+k+'">'+l+'</button>';
  }).join('')+'</div>';
}

/* ---------- transactions ---------- */
function listHTML(){
  var q=U.q.trim();
  var items=S.tx.filter(function(t){return t.date.slice(0,7)===U.month});
  if(q)items=items.filter(function(t){return (catOf(t).n+' '+t.note+' '+goalName(t)).indexOf(q)>-1});
  items.sort(function(a,b){return b.date.localeCompare(a.date)||b.id.localeCompare(a.id)});
  if(!items.length){
    return '<div class="empty">'+ic('file')+'<b>'+(q?'لا نتائج مطابقة':'لا توجد سجلات')+'</b><span>'+(q?'جرّب كلمة أخرى':'اضغط + لإضافة أول معاملة لهذا الشهر')+'</span></div>';
  }
  var groups=[],map={};
  items.forEach(function(t){if(!map[t.date]){map[t.date]={d:t.date,rows:[]};groups.push(map[t.date])}map[t.date].rows.push(t)});
  return groups.map(function(g){
    var ex=g.rows.reduce(function(a,t){return t.type==='exp'?a+t.amount:a},0);
    return '<section><div class="day"><b>'+dayLabel(g.d)+'</b><span>'+(ex?money(ex,'−')+' '+S.cur:'')+'</span></div><ul class="list">'+g.rows.map(function(t){
      var c=catOf(t),open=U.open===t.id;
      var sub=t.note||(t.type==='sav'&&goalName(t)?'إلى '+goalName(t):'');
      var sign=t.type==='exp'?'−':t.type==='inc'?'+':'';
      return '<li class="row"><button class="row-main" data-act="row" data-id="'+t.id+'" aria-expanded="'+open+'">'
        +'<span class="ico" style="--tint:var('+c.c+')">'+ic(c.i)+'</span>'
        +'<span class="meta"><b>'+c.n+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</span>'
        +'<span class="amt '+t.type+'">'+money(t.amount,sign)+'<i>'+esc(S.cur)+'</i></span></button>'
        +(open?'<div class="row-ext"><span>'+fullDate(t.date)+'</span><button class="link bad" data-act="del" data-id="'+t.id+'">حذف</button></div>':'')
        +'</li>';
    }).join('')+'</ul></section>';
  }).join('');
}
function txView(){
  var s=sums(U.month),bal=s.inc-s.exp-s.sav,h='';
  h+=head('المعاملات','<button class="iconbtn" data-act="report-open" aria-label="تقرير">'+ic('file')+'</button><button class="iconbtn'+(U.search?' on':'')+'" data-act="search" aria-label="بحث">'+ic('search')+'</button>');
  if(S.demo)h+='<div class="demo"><span>بيانات تجريبية للمعاينة</span><button class="link" data-act="clear-demo">ابدأ من الصفر</button></div>';
  h+='<div class="hero"><p class="lbl">الرصيد</p><p class="big">'+money(bal,bal<0?'−':'').replace('−−','−')+'<i>'+esc(S.cur)+'</i></p>';
  h+='<div class="trio">'
    +'<div class="stat"><div class="k g">'+ic('down')+'دخل</div><div class="v">'+money(s.inc)+'</div></div>'
    +'<div class="stat"><div class="k b">'+ic('up')+'نفقات</div><div class="v">'+money(s.exp)+'</div></div>'
    +'<div class="stat"><div class="k a">'+ic('target')+'ادخار</div><div class="v">'+money(s.sav)+'</div></div></div>';
  if(S.budget>0){
    var pct=Math.min(100,s.exp/S.budget*100),cl=s.exp>=S.budget?' over':s.exp>=S.budget*.8?' warn':'';
    var left=S.budget-s.exp;
    h+='<div class="budget"><div class="row2"><span>ميزانية الشهر</span><span>'+(left>=0?'المتبقي ':'تجاوزت بـ ')+money(Math.abs(left))+' '+esc(S.cur)+'</span></div><div class="bar'+cl+'"><i style="width:'+pct+'%"></i></div></div>';
  }
  h+='</div>'+chips();
  if(U.search)h+='<input id="q" class="search" type="search" placeholder="ابحث في المعاملات" value="'+esc(U.q)+'" aria-label="بحث">';
  h+='<div id="txlist" style="display:flex;flex-direction:column;gap:6px">'+listHTML()+'</div>';

}

/* ---------- stats ---------- */
function trend(){
  var ks=lastMonths(MONTHS_BACK).reverse(),data=ks.map(function(k){var s=sums(k);return {k:k,inc:s.inc,exp:s.exp}});
  var max=Math.max(1,Math.max.apply(null,data.map(function(d){return Math.max(d.inc,d.exp)})));
  var slot=60,base=140,mh=116,out='';
  out+='<line class="gl" x1="0" x2="360" y1="'+base+'" y2="'+base+'"/><line class="gl" x1="0" x2="360" y1="'+(base-mh)+'" y2="'+(base-mh)+'"/>';
  out+='<text class="ax" x="'+(MYL_L.rtl?358:2)+'" y="'+(base-mh-6)+'" text-anchor="'+(MYL_L.rtl?'end':'start')+'">'+fmt(max)+'</text>';
  data.forEach(function(d,i){
    var cx=MYL_L.rtl?360-(i+.5)*slot:(i+.5)*slot,hi=Math.max(d.inc?2:0,d.inc/max*mh),he=Math.max(d.exp?2:0,d.exp/max*mh);
    out+='<g data-act="month" data-v="'+d.k+'" style="cursor:pointer"><rect x="'+(cx-30)+'" y="0" width="60" height="170" fill="transparent"/>'
      +'<rect class="b-exp" x="'+(cx-17)+'" y="'+(base-he)+'" width="14" height="'+he+'" rx="4"/>'
      +'<rect class="b-inc" x="'+(cx+3)+'" y="'+(base-hi)+'" width="14" height="'+hi+'" rx="4"/>'
      +'<text class="ax'+(d.k===U.month?' on':'')+'" x="'+cx+'" y="160" text-anchor="middle">'+monthName(d.k)+'</text></g>';
  });
  return '<svg class="chart" viewBox="0 0 360 170" role="img" aria-label="الدخل والنفقات لآخر ستة أشهر">'+out+'</svg><div class="key"><span>نفقات</span><span class="i">دخل</span></div>';
}
function statsView(){
  var type=U.stat,key=U.month;
  var list=S.tx.filter(function(t){return t.date.slice(0,7)===key&&t.type===type});
  var by={};list.forEach(function(t){var kk=catKey(t);by[kk]=(by[kk]||0)+t.amount});
  var rows=Object.keys(by).map(function(k){return [k,by[k]]}).sort(function(a,b){return b[1]-a[1]});
  var total=rows.reduce(function(a,r){return a+r[1]},0);
  var h=head('الإحصاءات');
  h+='<div class="seg" role="tablist"><button class="'+(type==='exp'?'on':'')+'" data-act="stat" data-v="exp">نفقات</button><button class="'+(type==='inc'?'on':'')+'" data-act="stat" data-v="inc">دخل</button></div>'+chips();
  if(!total){
    h+='<div class="card"><div class="empty">'+ic('pie')+'<b>لا توجد سجلات</b><span>لا توجد '+(type==='exp'?'نفقات':'مداخيل')+' في هذا الشهر</span></div></div>';
  }else{
    var acc=0,gap=rows.length>1?1.2:0;
    var segs=rows.map(function(r){
      var p=r[1]/total*100,len=Math.max(p-gap,.1),c=catByKey(type,r[0]);
      var el='<circle cx="21" cy="21" r="15.9155" fill="none" style="stroke:var('+c.c+')" stroke-width="4.5" stroke-dasharray="'+len.toFixed(3)+' '+(100-len).toFixed(3)+'" stroke-dashoffset="'+(25-acc).toFixed(3)+'"/>';
      acc+=p;return el;
    }).join('');
    h+='<div class="card"><div class="donut"><svg viewBox="0 0 42 42" role="img" aria-label="توزيع الفئات"><circle class="dt" cx="21" cy="21" r="15.9155"/>'+segs+'</svg>'
      +'<div class="donut-c"><small>'+(type==='exp'?'إجمالي النفقات':'إجمالي الدخل')+'</small><b>'+money(total)+'</b><i>'+esc(S.cur)+'</i></div></div>'
      +'<div class="leg">'+rows.map(function(r){
        var c=catByKey(type,r[0]),p=r[1]/total*100;
        return '<div class="lg" style="--tint:var('+c.c+')"><span class="ico">'+ic(c.i)+'</span><span class="nm">'+c.n+'<span>'+fmt(Math.round(p))+'٪</span></span><span class="vl">'+money(r[1])+' '+esc(S.cur)+'</span><div class="bar"><i style="width:'+p.toFixed(1)+'%"></i></div></div>';
      }).join('')+'</div></div>';
    if(type==='exp'){
      var p=key.split('-').map(Number),today=new Date(),days=key===mkey(today)?today.getDate():new Date(p[0],p[1],0).getDate();
      h+='<div class="facts"><div class="fact"><small>متوسط الصرف اليومي</small><b>'+money(total/days)+' '+esc(S.cur)+'</b></div><div class="fact"><small>أكثر فئة إنفاقاً</small><b>'+catByKey('exp',rows[0][0]).n+'</b></div></div>';
    }
  }
  h+='<div class="card"><h2>آخر ستة أشهر</h2>'+trend()+'</div>';
  return h;
}

/* ---------- savings ---------- */
function ring(p){
  var r=26,c=2*Math.PI*r;
  return '<svg viewBox="0 0 64 64" class="ringsvg" aria-hidden="true"><circle class="rt" cx="32" cy="32" r="'+r+'"/>'+(p>0?'<circle class="rf" cx="32" cy="32" r="'+r+'" stroke-dasharray="'+(c*p/100).toFixed(2)+' '+c.toFixed(2)+'" transform="rotate(-90 32 32)"/>':'')+'</svg>';
}
function savView(){
  var total=S.tx.reduce(function(a,t){return t.type==='sav'?a+t.amount:a},0);
  var h=head('المدخرات','<button class="iconbtn" data-act="new-goal" aria-label="هدف جديد">'+ic('plus')+'</button>');
  h+='<div class="hero"><p class="lbl">إجمالي المدخرات</p><p class="big">'+money(total)+'<i>'+esc(S.cur)+'</i></p><p class="note" style="margin-top:6px">موزعة على '+fmt(S.goals.length)+' '+(S.goals.length>2&&S.goals.length<11?'أهداف':'هدف')+'</p></div>';
  if(!S.goals.length){
    h+='<div class="card"><div class="empty">'+ic('target')+'<b>لا توجد أهداف بعد</b><span>أنشئ هدفاً مثل سيارة أو سفر، ثم حوّل إليه من كل معاملة.</span><button class="btn" data-act="new-goal" style="margin-top:8px">هدف جديد</button></div></div>';
  }
  S.goals.forEach(function(g){
    var sv=savedOf(g.id),p=g.target>0?Math.min(100,sv/g.target*100):0,done=sv>=g.target&&g.target>0;

/* ---------- actions ---------- */
function act(a,d){
  var sh=U.sheet;
  switch(a){
    case 'nav':U.view=d.v;U.open=null;U.confirm=null;U.search=false;U.q='';render();window.scrollTo(0,0);
      var s=$('#screen');s.classList.remove('in');void s.offsetWidth;s.classList.add('in');break;
    case 'month':U.month=d.v;U.open=null;render();break;
    case 'search':U.search=!U.search;if(!U.search)U.q='';render();if(U.search){var q=$('#q');if(q)q.focus()}break;
    case 'row':U.open=U.open===d.id?null:d.id;render();break;
    case 'del':
      var i=S.tx.findIndex(function(t){return t.id===d.id});
      if(i>-1){var t=S.tx.splice(i,1)[0];save();U.open=null;render();toast('تم حذف المعاملة','تراجع',function(){S.tx.push(t);save();render()})}break;
    case 'stat':U.stat=d.v;render();break;
    case 'add':openAdd('exp');break;
    case 'deposit':openAdd('sav',d.id);break;
    case 'stype':if(sh){sh.type=d.v;sh.cat='';sh.cname='';sh.cicon='';renderSheet(false)}break;
    case 'cat':if(sh){sh.cat=d.v;renderSheet(false);if(d.v==='other'){var cn2=$('#cname');if(cn2)cn2.scrollIntoView({block:'center',behavior:'smooth'})}}break;
    case 'cicon':if(sh){sh.cicon=d.v;renderSheet(false)}break;
    case 'focusamt':var ai=$('#amt');if(ai)ai.focus();break;
    case 'quick':if(sh){sh.amount=d.v==='clear'?'':String(toNum(sh.amount)+Number(d.v));var ae=$('#amt');if(ae)ae.value=sh.amount;syncSave()}break;
    case 'pickgoal':if(sh){sh.goal=d.v;renderSheet(false)}break;
    case 'close':U.sheet=null;renderSheet();break;
    case 'backdrop':break;
    case 'save-tx':
      if(!canSave())break;
      var date=sh.date||ymd(new Date());
      var cat=sh.type==='sav'?'sav':sh.cat,cn='',ci='';
      if(sh.type!=='sav'){
        if(cat.slice(0,2)==='x:'){var s2=cat.slice(2),ix=s2.indexOf('|');ci=s2.slice(0,ix);cn=s2.slice(ix+1);cat='other'}
        else if(cat==='other'){cn=(sh.cname||'').trim();if(cn||sh.cicon){cn=cn||'أخرى';ci=sh.cicon||'dots'}}
      }
      S.tx.push({id:uid(),date:date,type:sh.type,cat:cat,cn:cn,ci:ci,amount:toNum(sh.amount),note:sh.note.trim(),goal:sh.type==='sav'?sh.goal:''});
      save();var k=mkey(parse(date));if(lastMonths(MONTHS_BACK).indexOf(k)>-1)U.month=k;
      U.sheet=null;renderSheet();render();toast('تمت الإضافة');break;
    case 'new-goal':U.sheet={kind:'goal',name:'',target:'',back:null};renderSheet(true);break;
    case 'new-goal-from-add':U.sheet={kind:'goal',name:'',target:'',back:sh};renderSheet(true);break;
    case 'save-goal':
      if(!sh||!sh.name.trim()||toNum(sh.target)<=0)break;
      var g={id:uid(),name:sh.name.trim(),target:toNum(sh.target)};S.goals.push(g);save();
      if(sh.back){U.sheet=sh.back;U.sheet.type='sav';U.sheet.goal=g.id;renderSheet(false)}else{U.sheet=null;renderSheet()}
      render();break;
    case 'goal-del':U.confirm=d.id;render();break;
    case 'goal-del-no':U.confirm=null;render();break;
    case 'goal-del-yes':
      S.goals=S.goals.filter(function(x){return x.id!==d.id});
      S.tx=S.tx.filter(function(t){return !(t.type==='sav'&&t.goal===d.id)});
      U.confirm=null;save();render();break;
    case 'report-open':openReport();break;
    case 'rp-per':if(sh){sh.per=d.v;renderSheet(false)}break;
    case 'rp-nav':if(sh){var n=+d.v;
      if(sh.per==='day'){var dd=parse(sh.date);dd.setDate(dd.getDate()+n);sh.date=ymd(dd)}
      else if(sh.per==='month'){var q=sh.month.split('-').map(Number),m2=new Date(q[0],q[1]-1+n,1);sh.month=mkey(m2)}
      else sh.year+=n;
      renderSheet(false)}break;
    case 'clear-demo':S.tx=[];S.goals=[];S.demo=false;save();render();break;
    case 'clear-all-yes':S.tx=[];S.goals=[];S.demo=false;S.budget=0;U.confirm=null;save();U.sheet=null;renderSheet();render();toast('تم مسح البيانات');break;
    case 'load-demo':S.tx=[];S.goals=[];seed(S);save();render();break;
    case 'account-open':U.sheet={kind:'account',step:'',msg:'',pending:null,err:''};renderSheet(true);break;
    case 'acct-step':if(sh){sh.step=sh.step===d.v?'':d.v;sh.pending=null;sh.err='';renderSheet(false)}break;
    case 'backup-do':if(sh)doBackup(d.v);break;
    case 'restore-pick':var rf=$('#rfile');if(rf){rf.value='';rf.click()}break;
    case 'restore-apply':if(sh&&sh.pending){applyBackup(sh.pending);U.sheet=null;renderSheet();render();toast('تمت الاستعادة')}break;
    case 'g-noop':break;
    case 'lang':MYL_L.set(d.v);nf=new Intl.NumberFormat(MYL_L.loc,{maximumFractionDigits:2});YF=new Intl.NumberFormat(MYL_L.loc,{useGrouping:false});render();renderSheet(false);if($('#gpanel'))renderGatePanel(false);break;
    case 'logout':doLogout();break;
    case 'g-sel':gateSt.sel=d.v;gateSt.pinShown=false;gateSt.err='';gateSt.forgot=false;renderGatePanel(true);break;
    case 'g-login':gateLogin();break;
    case 'g-bio':gateBio();break;
    case 'g-pinshow':gateSt.pinShown=true;gateSt.err='';renderGatePanel(false);break;
    case 'g-add':gateSt.mode='reg';gateSt.err='';gateSt.forgot=false;renderGatePanel(false);break;
    case 'g-back':gateSt.mode='login';gateSt.err='';renderGatePanel(false);break;
    case 'g-create':gateCreate();break;
    case 'g-forgot':gateSt.forgot=!gateSt.forgot;renderGatePanel(false);break;
    case 'g-forgot-yes':gateDelete();break;
    case 'acct-bio':acctBio();break;
    case 'cur':S.cur=d.v;save();render();break;
    case 'theme':S.theme=d.v;save();applyTheme();render();break;
  }
}

var YF=new Intl.NumberFormat(MYL_L.loc,{useGrouping:false});
var arD=function(s){return String(s).replace(/\d/g,function(d){return AR[d]})};
var PAL=['#ff8a5b','#ffd23f','#5cc8ff','#b388ff','#4ad8a0','#ff6b9a','#7c9cff','#ff5d5d','#46c2c2','#c0d94a','#ff9f1c','#8d99ae'];
var FF='"IBM Plex Sans Arabic","Readex Pro","Noto Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif';
function fmtDay(ds){return new Intl.DateTimeFormat(MYL_L.loc,{day:'numeric',month:'long',year:'numeric'}).format(parse(ds))}
function monthEnd(key){var p=key.split('-').map(Number);return ymd(new Date(p[0],p[1],0))}
function weekRange(ds){var d=parse(ds),off=(d.getDay()+1)%7,a=new Date(d.getFullYear(),d.getMonth(),d.getDate()-off),b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6);return [ymd(a),ymd(b)]}
function rangeSpec(sh){
  var f,t,label,test,ms=null;
  if(sh.per==='day'){f=t=sh.date||ymd(new Date());label=fmtDay(f);test=function(x){return x.date===f}}
  else if(sh.per==='week'){var w=weekRange(sh.date||ymd(new Date()));f=w[0];t=w[1];label='من '+fmtDay(f)+' إلى '+fmtDay(t);test=function(x){return x.date>=f&&x.date<=t}}
  else if(sh.per==='year'){f=sh.year+'-01-01';t=sh.year+'-12-31';label='سنة '+YF.format(sh.year);test=function(x){return x.date>=f&&x.date<=t}}
  else if(sh.per==='custom'){f=sh.from||ymd(new Date());t=sh.to||f;if(f>t){var z=f;f=t;t=z}label='من '+fmtDay(f)+' إلى '+fmtDay(t);test=function(x){return x.date>=f&&x.date<=t}}
  else{
    ms=sh.months.slice().sort();var set={};ms.forEach(function(k){set[k]=1});
    if(!ms.length){f=t=ymd(new Date());label='لم تختر شهراً'}
    else{f=ms[0]+'-01';t=monthEnd(ms[ms.length-1]);
      label=ms.length<=3?ms.map(function(k){return monthName(k,true)}).join(' و '):'من '+monthName(ms[0],true)+' إلى '+monthName(ms[ms.length-1],true)+' ('+fmt(ms.length)+' أشهر)'}
    test=function(x){return !!set[x.date.slice(0,7)]};
  }
  return {from:f,to:t,label:label,test:test,months:ms};
}
function rawCat(type,key){if(key.slice(0,2)==='x:'){var r=key.slice(2);return r.slice(r.indexOf('|')+1)}return catById(type,key).n}
function toRows(map,type){return Object.keys(map).map(function(k){var c=catByKey(type,k);return {name:rawCat(type,k),v:map[k],ci:parseInt(c.c.slice(3),10)||12}}).sort(function(a,b){return b.v-a.v})}
function buildReport(sh){
  var sp=rangeSpec(sh),list=S.tx.filter(sp.test).sort(function(a,b){return a.date.localeCompare(b.date)||a.id.localeCompare(b.id)});
  var r={sp:sp,list:list,inc:0,exp:0,sav:0,byExp:{},byInc:{}};
  list.forEach(function(t){
    var k=catKey(t);
    if(t.type==='inc'){r.inc+=t.amount;r.byInc[k]=(r.byInc[k]||0)+t.amount}
    else if(t.type==='exp'){r.exp+=t.amount;r.byExp[k]=(r.byExp[k]||0)+t.amount}
    else r.sav+=t.amount;
  });
  r.bal=r.inc-r.exp-r.sav;
  r.exps=toRows(r.byExp,'exp');r.incs=toRows(r.byInc,'inc');
  return r;
}
var TYPEN={exp:'نفقة',inc:'دخل',sav:'ادخار'};
function noteOf(t){var g=t.type==='sav'?goalName(t):'';return (g?'إلى '+g:'')+(g&&t.note?' - ':'')+(t.note||'')}
function catNameOf(t){return t.type==='sav'?'ادخار':rawCat(t.type,catKey(t))}

  if(sh.per==='day')h+='<div class="field"><input id="rpdate" type="date" value="'+esc(sh.date)+'"></div>';
  /* hero */
  h+='<div class="dhero"><p class="lbl">صافي الرصيد</p><p class="big">'+money(Math.abs(r.bal),r.bal<0?'−':'')+'<i>'+esc(S.cur)+'</i></p>'
    +'<div class="dtrio"><div><span class="dot" style="background:var(--good)"></span><small>الدخل</small><b>'+money(r.inc)+'</b></div><div><span class="dot" style="background:var(--bad)"></span><small>النفقات</small><b>'+money(r.exp)+'</b></div><div><span class="dot" style="background:var(--gold)"></span><small>المدخرات</small><b>'+money(r.sav)+'</b></div></div></div>';
  if(!r.list.length)return h+'<div class="empty">'+ic('file')+'<b>لا توجد معاملات</b><span>لا شيء مسجّل في هذه الفترة</span></div>';
  /* kpis */
  var days=sh.per==='day'?1:sh.per==='year'?(sh.year%4===0?366:365):new Date(+sh.month.slice(0,4),+sh.month.slice(5),0).getDate();
  var big=r.list.filter(function(t){return t.type==='exp'}).sort(function(a,b){return b.amount-a.amount})[0];
  var rate=r.inc>0?Math.round(r.sav/r.inc*100):0;
  h+='<div class="kpis"><div><small>عدد المعاملات</small><b>'+fmt(r.list.length)+'</b></div><div><small>متوسط الإنفاق اليومي</small><b>'+money(Math.round(r.exp/days))+'</b></div><div><small>أكبر نفقة</small><b>'+(big?money(big.amount):'—')+'</b></div><div><small>نسبة الادخار من الدخل</small><b>'+fmt(rate)+'٪</b></div></div>';
  /* income vs expense */
  var tot=r.inc+r.exp;
  if(tot>0){var ip=Math.round(r.inc/tot*100);
    h+='<div class="dcard"><p class="exl">الدخل مقابل الإنفاق</p><div class="vs"><u style="width:'+ip+'%;background:var(--good)"></u><u style="width:'+(100-ip)+'%;background:var(--bad)"></u></div><div class="vsl"><span style="color:var(--good)">دخل <bdi>'+fmt(ip)+'٪</bdi></span><span style="color:var(--bad)">إنفاق <bdi>'+fmt(100-ip)+'٪</bdi></span></div></div>';}
  /* trend */
  if(sh.per!=='day'){
    var n=sh.per==='year'?12:days,inc=[],ex=[],lab=[];
    for(var k=0;k<n;k++){inc.push(0);ex.push(0);lab.push(k+1)}
    r.list.forEach(function(t){var ix=sh.per==='year'?+t.date.slice(5,7)-1:+t.date.slice(8,10)-1;if(t.type==='inc')inc[ix]+=t.amount;else if(t.type==='exp')ex[ix]+=t.amount});
    var mx=Math.max.apply(null,inc.concat(ex).concat([1])),W=300,H=110,bw=W/n,g='';
    for(var q=0;q<n;q++){
      var x=(MYL_L.rtl?W-(q+1)*bw:q*bw)+bw*.12,w=bw*.76/2,hi=inc[q]/mx*H,he=ex[q]/mx*H;
      g+='<rect x="'+(x+w).toFixed(1)+'" y="'+(H-hi).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(hi,inc[q]?2:0).toFixed(1)+'" rx="1.5" fill="var(--good)"/>';
      g+='<rect x="'+x.toFixed(1)+'" y="'+(H-he).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(he,ex[q]?2:0).toFixed(1)+'" rx="1.5" fill="var(--bad)"/>';
    }
    var step=sh.per==='year'?1:5,xl='';
    for(var m=0;m<n;m++){if(sh.per==='year'||m===0||(m+1)%step===0)xl+='<span>'+(sh.per==='year'?monthName(sh.year+'-'+pad(m+1)):fmt(m+1))+'</span>'}
    h+='<div class="dcard"><p class="exl">'+(sh.per==='year'?'الحركة الشهرية':'الحركة اليومية')+'</p><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" class="trend" role="img" aria-label="رسم الدخل والنفقات">'+g+'</svg><div class="xl'+(sh.per==='year'?' yr':'')+'">'+xl+'</div></div>';
  }
  /* donut */
  function donut(rows,total,ttl){
    if(!rows.length||!total)return '';
    var top=rows.slice(0,6),rest=rows.slice(6).reduce(function(a,x){return a+x.v},0);
    if(rest>0)top.push({name:'أخرى',v:rest,ci:12});
    var off=0,seg='',leg='';
    top.forEach(function(x,ix){if(x.name!=='أخرى')x.ci=ix+1;var pc=x.v/total*100;
      seg+='<circle r="15.915" cx="21" cy="21" fill="none" stroke="var(--c'+x.ci+')" stroke-width="5.2" stroke-dasharray="'+Math.max(pc-.8,.2).toFixed(2)+' '+(100-Math.max(pc-.8,.2)).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';
      off+=pc;
      leg+='<div class="lg"><i style="background:var(--c'+x.ci+')"></i><span>'+esc(x.name)+'</span><b>'+fmt(Math.round(pc))+'٪</b><small>'+money(x.v)+'</small></div>'});
    return '<div class="dcard"><p class="exl">'+ttl+'</p><div class="donutw"><div class="donut"><svg viewBox="0 0 42 42" style="transform:rotate(-90deg)"><circle r="15.915" cx="21" cy="21" fill="none" stroke="var(--surface2)" stroke-width="5.2"/>'+seg+'</svg><div class="dc"><small>الإجمالي</small><b>'+money(total)+'</b></div></div><div class="legend">'+leg+'</div></div></div>';
  }
  h+=donut(r.exps,r.exp,'توزيع النفقات');
  h+=donut(r.incs,r.inc,'مصادر الدخل');
  /* latest */
  h+='<div class="dcard"><p class="exl">آخر المعاملات</p>'+r.list.slice().reverse().slice(0,10).map(function(t){
    var sign=t.type==='inc'?'+':t.type==='exp'?'−':'';
    return '<div class="rprow"><div><b>'+esc(catNameOf(t))+'</b><small>'+esc(fmtDay(t.date))+(noteOf(t)?' · '+esc(noteOf(t)):'')+'</small></div><span class="'+(t.type==='inc'?'g':t.type==='exp'?'b':'')+'">'+money(t.amount,sign)+'</span></div>'}).join('')+(r.list.length>10?'<p class="note">و '+fmt(r.list.length-10)+' معاملة أخرى</p>':'')+'</div>';
  return h;
}

var NATIVE=null;
function b64(blob){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(',')[1])};fr.onerror=rej;fr.readAsDataURL(blob)})}
function natv(){var C=window.Capacitor;if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.registerPlugin){if(!NATIVE)NATIVE={fs:C.registerPlugin('Filesystem'),sh:C.registerPlugin('Share')};return NATIVE}return null}
function backupData(){return JSON.stringify({app:'MYL',v:2,date:new Date().toISOString(),name:S.name,tx:S.tx,goals:S.goals,budget:S.budget,cur:S.cur})}
function doBackup(mode){
  if(natv())toast(mode==='drive'?'اختر Drive من القائمة':'اختر الملفات من القائمة');
  var name='MYL-backup-'+ymd(new Date())+'.json',blob=new Blob([backupData()],{type:'application/json'}),N=natv();
  if(!N){
    var dl=function(){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(u)},500);toast('تم تنزيل الملف في التنزيلات')};
    try{
      var f=new File([blob],name,{type:'text/plain'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:name}).catch(function(e){var m=String(e&&e.name||e);if(m.indexOf('Abort')>-1)return;dl()});
        return;
      }
    }catch(e){}
    dl();return;
  }
  if(false){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(u)},500);toast('تم تنزيل ملف النسخة الاحتياطية');return}
  b64(blob).then(function(d){
    return N.fs.writeFile({path:name,data:d,directory:'CACHE'}).then(function(r){
      return N.sh.share({title:name,files:[r.uri],dialogTitle:mode==='drive'?'اختر Drive':'اختر الملفات لحفظها على الهاتف'}).catch(function(e){
        var m=String(e&&e.message||e).toLowerCase();if(m.indexOf('cancel')>-1||m.indexOf('abort')>-1)throw e;
        return N.fs.writeFile({path:name,data:d,directory:'EXTERNAL'}).then(function(){toast('حُفظ في ملفات التطبيق على الهاتف')});
      });
    });
  }).catch(function(e){
    var m=String(e&&e.message||e).toLowerCase();if(m.indexOf('cancel')>-1||m.indexOf('abort')>-1)return;
    toast('تعذر حفظ الملف: '+String(e&&e.message||e).slice(0,50));
  });
}
function parseBackup(text){
  var o=JSON.parse(String(text).trim());
  if(!o||!Array.isArray(o.tx)||!Array.isArray(o.goals))throw 0;
  var okT=o.tx.every(function(t){return t&&typeof t.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&typeof t.amount==='number'&&(t.type==='exp'||t.type==='inc'||t.type==='sav')});
  var okG=o.goals.every(function(x){return x&&typeof x.id==='string'&&typeof x.name==='string'&&typeof x.target==='number'});
  if(!okT||!okG)throw 0;
  return o;
}
function readBackupFile(f){
  var sh=U.sheet;if(!sh||sh.kind!=='account')return;
  var fr=new FileReader();
  fr.onload=function(){
    try{sh.pending=parseBackup(fr.result);sh.err=''}catch(e){sh.pending=null;sh.err='هذا الملف ليس نسخة احتياطية من MYL.'}
    sh.step='restore';renderSheet(false);
  };
  fr.onerror=function(){sh.err='تعذر قراءة الملف.';sh.step='restore';renderSheet(false)};
  fr.readAsText(f);
}
function applyBackup(o){
  S.tx=o.tx.map(function(t){return {id:t.id,date:t.date,type:t.type,cat:String(t.cat||''),amount:t.amount,note:String(t.note||''),goal:String(t.goal||''),cn:String(t.cn||''),ci:String(t.ci||'')}});
  S.goals=o.goals.map(function(x){return {id:x.id,name:x.name,target:x.target}});

function hexOf(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('')}
function rnd(n){var a=new Uint8Array(n);try{crypto.getRandomValues(a)}catch(e){for(var i=0;i<n;i++)a[i]=Math.floor(Math.random()*256)}return a}
function hashPin(pin,salt){
  try{var enc=new TextEncoder();
    return crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(salt),iterations:60000},k,256)}).then(hexOf);
  }catch(e){var h=5381,str=salt+pin;for(var r=0;r<3000;r++)for(var i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i)+r)|0;return Promise.resolve('f'+(h>>>0).toString(16))}
}
function normPin(v){return String(v||'').replace(/[٠-٩]/g,function(d){return AR.indexOf(d)}).replace(/\D/g,'')}
function u8b64(u){var s2='';for(var i=0;i<u.length;i++)s2+=String.fromCharCode(u[i]);return btoa(s2).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64u8(b){b=b.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';var s2=atob(b),u=new Uint8Array(s2.length);for(var i=0;i<s2.length;i++)u[i]=s2.charCodeAt(i);return u}
var BIOWHY='',BP=null;
function isNative(){var C=window.Capacitor;return !!(C&&C.isNativePlatform&&C.isNativePlatform()&&C.registerPlugin)}
function bioPlug(){
  if(!isNative())return null;
  if(!BP){try{BP=window.Capacitor.registerPlugin('BiometricAuthNative')}catch(e){}}
  return BP;
}
function bioAvail(){
  BIOWHY='';
  if(isNative()){
    var tryCheck=function(P){return Promise.resolve().then(function(){return P.checkBiometry()})};
    return tryCheck(bioPlug()).catch(function(e){
      try{var alt=window.Capacitor.registerPlugin('BiometricAuth');return tryCheck(alt).then(function(r){BP=alt;return r})}catch(x){throw e}
    }).then(function(r){
      if(r&&r.isAvailable)return true;
      BIOWHY=r&&r.biometryType===0?'لا توجد بصمة مسجّلة في إعدادات الهاتف. أضف بصمتك من إعدادات الأمان أولاً':'الهاتف لا يوفّر بصمة متاحة'+(r&&r.reason?' ('+r.reason+')':'');
      return false;
    },function(){}).catch(function(){}).then(function(v){
      if(v===true)return true;
      if(!BIOWHY)BIOWHY='إضافة البصمة غير مضمّنة في هذا التطبيق. حدّث ملف main.yml ثم أعد بناء التطبيق';
      return false;
    });
  }
  try{if(window.PublicKeyCredential&&PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable)return PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function(v){if(!v)BIOWHY='لا توجد بصمة أو قفل شاشة مفعّل على الهاتف';return v},function(){BIOWHY='المتصفح لا يدعم البصمة. ثبّت تطبيق APK';return false})}catch(e){}
  BIOWHY='هذا المتصفح لا يدعم البصمة. ثبّت تطبيق APK';

}
function bioEnroll(name){

  return navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'MYL'},user:{id:rnd(16),name:name,displayName:name},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}})
    .then(function(c){return {ok:true,cred:u8b64(new Uint8Array(c.rawId))}},function(){return {ok:false}});

function bioCheck(u){
  var P=bioPlug();
  if(P)return P.authenticate({reason:MYL_L.tr('تسجيل الدخول إلى MYL'),cancelTitle:MYL_L.tr('استخدم الرقم السري'),allowDeviceCredential:false,androidTitle:'MYL',androidSubtitle:MYL_L.tr('ضع إصبعك على المستشعر')}).then(function(){return true},function(){return false});

function gateLogin(){
  var u=selUser();if(!u||gateSt.busy)return;
  var now=Date.now();if(now<gateSt.until){gateMsg('انتظر '+Math.ceil((gateSt.until-now)/1000)+' ثانية ثم حاول مجدداً');return}
  var pin=normPin(($('#gpin')||{}).value);
  if(pin.length<4){gateMsg('أدخل الرقم السري (٤ إلى ٦ أرقام)');return}
  gateSt.busy=true;
  hashPin(pin,u.salt).then(function(h){
    gateSt.busy=false;
    if(h===u.hash){gateSt.fails=0;enterApp(u)}
    else{gateSt.fails++;var pi=$('#gpin');if(pi){pi.value='';pi.focus()}
      if(gateSt.fails>=5){gateSt.until=Date.now()+30000;gateSt.fails=0;gateMsg('محاولات كثيرة. انتظر ٣٠ ثانية')}else gateMsg('الرقم السري غير صحيح')}
  });
}
function gateBio(){
  var u=selUser();if(!u||!u.bio||gateSt.busy)return;
  gateSt.busy=true;
  bioCheck(u).then(function(ok){gateSt.busy=false;if(ok)enterApp(u);else{gateSt.pinShown=true;renderGatePanel(false);gateMsg('تعذر التحقق بالبصمة، اكتب الرقم السري')}});
}
function gateCreate(){
  if(gateSt.busy)return;
  var name=(($('#rname')||{}).value||'').trim().slice(0,30),p1=normPin(($('#rpin')||{}).value),p2=normPin(($('#rpin2')||{}).value),wantBio=!!(($('#rbio')||{}).checked);
  if(!name){gateMsg('اكتب اسم المستخدم');return}
  if(USERS.some(function(u){return u.name===name})){gateMsg('هذا الاسم مستخدم بالفعل');return}
  if(p1.length<4||p1.length>6){gateMsg('الرقم السري من ٤ إلى ٦ أرقام');return}
  if(p1!==p2){gateMsg('الرقمان غير متطابقين');return}
  gateSt.busy=true;
  var salt=hexOf(rnd(12));
  Promise.all([hashPin(p1,salt),wantBio?bioEnroll(name):Promise.resolve({ok:false,skip:true})]).then(function(r){
    var u={id:uid(),name:name,salt:salt,hash:r[0],bio:!!r[1].ok,cred:r[1].ok?r[1].cred:''};
    var first=!USERS.length;
    if(first){try{var lg=localStorage.getItem(LEGACY);if(lg){localStorage.setItem(DK+u.id,lg);localStorage.removeItem(LEGACY)}}catch(e){}}
    USERS.push(u);saveUsers();gateSt.busy=false;
    if(wantBio&&!r[1].ok)toast('تعذر تفعيل البصمة، يمكنك تفعيلها لاحقاً من الحساب');
    gateSt.sel=u.id;enterApp(u);
  });
}
function gateDelete(){
  var u=selUser();if(!u)return;
  USERS=USERS.filter(function(x){return x.id!==u.id});saveUsers();
  try{localStorage.removeItem(DK+u.id)}catch(e){}
  gateSt.forgot=false;gateSt.pinShown=false;gateSt.sel=USERS[0]?USERS[0].id:'';gateSt.mode=USERS.length?'login':'reg';renderGatePanel(true);
}
function acctBio(){
  if(!CUR)return;
  if(CUR.bio){CUR.bio=false;CUR.cred='';saveUsers();renderSheet(false);toast('تم إيقاف البصمة');return}
  bioAvail().then(function(ok){
    if(!ok){toast('البصمة غير متاحة: '+(BIOWHY||''));return}
    bioEnroll(CUR.name).then(function(r){if(r.ok){CUR.bio=true;CUR.cred=r.cred;saveUsers();renderSheet(false);toast('تم تفعيل البصمة')}else toast('لم يتم تفعيل البصمة')});
  });
}
function gatePanelHTML(){
  var h='',u=selUser(),g=gateSt;
  h+='<img class="glogo" src="'+LOGO+'" alt="MYL">';
  if(USERS.length)h+='<div class="gtabs"><button class="'+(g.mode==='login'?'on':'')+'" data-act="g-back">تسجيل الدخول</button><button class="'+(g.mode==='reg'?'on':'')+'" data-act="g-add">مستخدم جديد</button></div>';
  if(g.mode==='reg'){
    h+='<h2>'+(USERS.length?'مستخدم جديد':'أهلاً بك في MYL')+'</h2><p class="gsub">'+(USERS.length?'أنشئ حساباً جديداً على هذا الجهاز':'أنشئ أول حساب للبدء')+'</p>'
      +'<input id="rname" type="text" maxlength="30" placeholder="الاسم" autocomplete="off">'
      +'<input id="rpin" type="password" inputmode="numeric" maxlength="6" placeholder="الرقم السري (٤ إلى ٦ أرقام)" autocomplete="new-password">'
      +'<input id="rpin2" type="password" inputmode="numeric" maxlength="6" placeholder="تأكيد الرقم السري" autocomplete="new-password">'
      +'<label class="gsw'+(g.bioAv?'':' off')+'"><span><b>الدخول بالبصمة</b><small>'+(g.bioAv?'بدل كتابة الرقم السري':'غير متاحة: '+esc(BIOWHY||'جارٍ الفحص...'))+'</small></span><input id="rbio" type="checkbox"'+(g.bioAv?'':' disabled')+'><i></i></label>'
      +'<p id="gerr" class="gerr">'+esc(g.err)+'</p>'
      +'<button class="btn block" data-act="g-create"><span>إنشاء الحساب</span></button>'
      ;
    return h;
  }
  if(!USERS.length){
    return h;
  }
  h+='<div class="gusers">'+USERS.map(function(x){return '<button class="guser'+(u&&x.id===u.id?' on':'')+'" data-act="g-sel" data-v="'+esc(x.id)+'"><span class="avatar">'+esc(Array.from(x.name)[0])+'</span><b>'+esc(x.name)+'</b></button>'}).join('')+'</div>';
  if(g.forgot){
    h+='<div class="gwarn"><b>حذف المستخدم «'+esc(u.name)+'»؟</b><p>سيُحذف المستخدم وكل بياناته من هذا الجهاز نهائياً. يمكنك استعادة بياناتك لاحقاً من ملف نسخة احتياطية إن كان لديك.</p><div style="display:flex;gap:8px"><button class="btn sm danger" data-act="g-forgot-yes">نعم، احذف</button><button class="btn sm ghost" data-act="g-forgot">تراجع</button></div></div>';
  }else if(u.bio&&!g.pinShown){
    h+='<button class="fpbtn" data-act="g-bio" aria-label="الدخول بالبصمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 11v3.5c0 1.6.5 3 1.4 4.3M8.5 14c0 2.3.8 4.2 2 5.7M6 11.5a6 6 0 0 1 12 0M9 11.5a3 3 0 0 1 6 0v3c0 1.2.2 2.2.6 3.2M3.5 12a8.5 8.5 0 0 1 17 0v1"/></svg></button><p class="gsub">المس المستشعر للدخول</p><button class="glink" data-act="g-pinshow">استخدم الرقم السري</button>';
  }else{
    h+='<input id="gpin" type="password" inputmode="numeric" maxlength="6" placeholder="الرقم السري" autocomplete="current-password"><p id="gerr" class="gerr">'+esc(g.err)+'</p><button class="btn block" data-act="g-login"><span>دخول</span></button>'+(u.bio?'<button class="glink" data-act="g-bio">الدخول بالبصمة</button>':'');
  }
  if(!g.forgot)h+='<button class="glink dim" data-act="g-forgot">نسيت الرقم السري؟</button>';
  return h;
}
function renderGatePanel(autoBio){
  var el=$('#gpanel');if(!el)return;
  el.innerHTML=gatePanelHTML();
  var u=selUser();
  if(gateSt.mode==='login'&&u&&u.bio&&!gateSt.pinShown&&!gateSt.forgot&&autoBio&&gateSt.pulled)setTimeout(gateBio,350);
  var f=$('#gpin')||$('#rname');if(f&&gateSt.pulled&&!(u&&u.bio&&!gateSt.pinShown))setTimeout(function(){try{f.focus()}catch(e){}},50);
}
function setLamp(on){
  var g=$('#gate');if(!g)return;
  gateSt.pulled=on;g.classList.toggle('on',on);
  if(on)renderGatePanel(true);
}
function showGate(startOff){
  var old=$('#gate');if(old)old.remove();
  gateSt.pulled=false;gateSt.mode=USERS.length?'login':'reg';gateSt.err='';gateSt.pinShown=false;gateSt.forgot=false;
  if(!selUser())gateSt.sel='';else gateSt.sel=gateSt.sel&&USERS.some(function(x){return x.id===gateSt.sel})?gateSt.sel:USERS[0].id;
  var g=document.createElement('div');g.id='gate';g.className='gate';
  g.innerHTML='<div class="cone"></div><div class="lamp"><svg viewBox="0 0 220 150" aria-hidden="true"><defs><linearGradient id="gsh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b3447"/><stop offset=".45" stop-color="#1c6b88"/><stop offset="1" stop-color="#082a3b"/></linearGradient><linearGradient id="ggo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#c98f14"/></linearGradient><radialGradient id="gbu" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#fff6d0"/><stop offset="1" stop-color="#ffc83d"/></radialGradient></defs><path d="M110 0v34" stroke="url(#ggo)" stroke-width="2.4"/><rect x="98" y="0" width="24" height="5" rx="2.5" fill="url(#ggo)"/><rect x="102" y="30" width="16" height="12" rx="3" fill="url(#ggo)"/><path class="shade" d="M52 112c0-38 24-70 58-70s58 32 58 70z" fill="url(#gsh)"/><path d="M70 96c4-26 20-44 40-44" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="3" stroke-linecap="round"/><rect x="48" y="109" width="124" height="7" rx="3.5" fill="url(#ggo)"/><ellipse class="lit" cx="110" cy="116" rx="52" ry="7"/><circle class="bulb" cx="110" cy="124" r="11" fill="#294455"/><path class="fil" d="M105 124l2.5-4 2.5 4 2.5-4 2.5 4" fill="none" stroke="#6b7f8a" stroke-width="1.2" stroke-linecap="round"/></svg><div class="cord" id="cord"><i></i><b id="bead" role="button" aria-label="اسحب الحبل"></b></div></div><p class="ghint">اسحب الحبل للأسفل لتضيء</p><div id="gpanel" class="gpanel"></div>';
  document.body.appendChild(g);document.body.classList.add('locked');
  bioAvail().then(function(v){gateSt.bioAv=v;if(gateSt.mode==='reg')renderGatePanel(false)});
  var bead=$('#bead'),cord=$('#cord'),y0=0,drag=false,dy=0;
  bead.addEventListener('pointerdown',function(e){drag=true;y0=e.clientY;dy=0;try{bead.setPointerCapture(e.pointerId)}catch(x){}cord.classList.add('drag');e.preventDefault()});
  bead.addEventListener('pointermove',function(e){if(!drag)return;dy=Math.max(0,Math.min(70,e.clientY-y0));cord.style.setProperty('--pull',dy+'px')});
  function end(){if(!drag)return;drag=false;cord.classList.remove('drag');cord.style.setProperty('--pull','0px');if(dy>=35||dy<6)setLamp(!gateSt.pulled);dy=0}
  bead.addEventListener('pointerup',end);bead.addEventListener('pointercancel',function(){drag=false;cord.classList.remove('drag');cord.style.setProperty('--pull','0px')});
  bead.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();setLamp(!gateSt.pulled)}});
  bead.tabIndex=0;
  g.addEventListener('keydown',function(e){if(e.key!=='Enter')return;var t=e.target;if(t.id==='gpin')gateLogin();else if(t.id==='rname'||t.id==='rpin'||t.id==='rpin2')gateCreate()});
}
loadUsers();

showGate(true);
})();
</script>
</body></html>
