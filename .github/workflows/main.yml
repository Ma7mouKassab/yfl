name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - icon.png

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir www
          cp index.html www/index.html

      - name: Create Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share
          npx cap init MYL com.yfl.finance --web-dir www
          npx cap add android
          npx cap sync android

      - name: Create app icons
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --break-system-packages pillow
          cat > make_icons.py <<'PYEOF'
          import os, sys
          from PIL import Image, ImageDraw, ImageFilter
          src = Image.open(sys.argv[1]).convert('RGBA')
          res = sys.argv[2]
          dens = {'mdpi': 1, 'hdpi': 1.5, 'xhdpi': 2, 'xxhdpi': 3, 'xxxhdpi': 4}
          w, h = src.size
          from PIL import ImageChops, ImageOps
          gh = Image.linear_gradient('L').rotate(90).resize((432, 432))
          gv = Image.linear_gradient('L').resize((432, 432))
          gd = ImageChops.add(gh, gv, scale=2.0)
          bg_big = ImageOps.colorize(gd, (10, 150, 160), (3, 58, 96)).convert('RGB')
          def fg_layer(px):
              canvas = Image.new('RGBA', (px, px), (0, 0, 0, 0))
              s = int(px * 0.70)
              ic = src.resize((s, s), Image.LANCZOS)
              canvas.paste(ic, ((px - s) // 2, (px - s) // 2), ic)
              return canvas
          for name, d in dens.items():
              folder = os.path.join(res, 'mipmap-' + name)
              os.makedirs(folder, exist_ok=True)
              a = int(108 * d)
              bg = bg_big.resize((a, a), Image.LANCZOS).convert('RGBA')
              fg = fg_layer(a)
              bg.save(os.path.join(folder, 'yfl_bg.png'))
              fg.save(os.path.join(folder, 'yfl_fg.png'))
              l = int(48 * d)
              src.resize((l, l), Image.LANCZOS).save(os.path.join(folder, 'ic_launcher.png'))
              comp = Image.alpha_composite(bg, fg)
              comp = comp.resize((l * 2, l * 2), Image.LANCZOS)
              mask = Image.new('L', (l * 2, l * 2), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, l * 2 - 1, l * 2 - 1), fill=255)
              comp.putalpha(mask)
              comp = comp.resize((l, l), Image.LANCZOS)
              comp.save(os.path.join(folder, 'ic_launcher_round.png'))
          anydpi = os.path.join(res, 'mipmap-anydpi-v26')
          os.makedirs(anydpi, exist_ok=True)
          xml = ('<?xml version="1.0" encoding="utf-8"?>\n'
                 '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                 '  <background android:drawable="@mipmap/yfl_bg"/>\n'
                 '  <foreground android:drawable="@mipmap/yfl_fg"/>\n'
                 '</adaptive-icon>\n')
          for n in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              open(os.path.join(anydpi, n), 'w').write(xml)
          print('icons done')
          import glob
          for sp in glob.glob(os.path.join(res, 'drawable*', 'splash.png')):
              try:
                  w0, h0 = Image.open(sp).size
              except Exception:
                  continue
              top = Image.new('RGB', (w0, h0), (8, 56, 84))
              bot = Image.new('RGB', (w0, h0), (4, 26, 43))
              canvas = Image.composite(bot, top, Image.linear_gradient('L').resize((w0, h0)))
              side = int(min(w0, h0) * 0.42)
              ic = src.resize((side, side), Image.LANCZOS)
              canvas.paste(ic, ((w0 - side) // 2, (h0 - side) // 2), ic)
              canvas.save(sp)
          print('splash done')
          PYEOF
          python3 make_icons.py icon.png android/app/src/main/res

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MYL-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
